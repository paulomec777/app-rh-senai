# Perfil de demonstração: ative com SPRING_PROFILES_ACTIVE=demo
# Usa um banco H2 em memória com dados fictícios (demo-data.sql),
# que volta ao estado inicial sempre que o servidor reinicia.
spring.datasource.url=jdbc:h2:mem:apprh;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:demo-data.sql
spring.sql.init.encoding=UTF-8
server.port=${PORT:8080}
